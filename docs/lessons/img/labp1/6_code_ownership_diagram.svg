<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">FRDM-MCXA153 template edit and build ownership diagram</title>
  <desc id="desc">Diagram explaining which files are edited manually, which files are generated by MCUXpresso Config Tools, and how CMakeLists.txt and board_files.cmake connect those files to the firmware build.</desc>
  <defs>
    <style>
      .bg { fill: #f5f7fa; }
      .panel { fill: #fff; stroke: #d0d8e8; stroke-width: 2; }
      .app { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; }
      .tool { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; }
      .build { fill: #eef2f7; stroke: #455a64; stroke-width: 2; }
      .fw { fill: #fff7e6; stroke: #b26a00; stroke-width: 2; }
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #0d1b3e; }
      .subtitle { font: 15px 'Segoe UI', Arial, sans-serif; fill: #455a64; }
      .head { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0d1b3e; }
      .body { font: 15px 'Segoe UI', Arial, sans-serif; fill: #455a64; }
      .small { font: 13px 'Segoe UI', Arial, sans-serif; fill: #455a64; }
      .mono { font: 14px Consolas, Menlo, monospace; fill: #0d1b3e; }
      .monoBold { font: 700 14px Consolas, Menlo, monospace; fill: #0d1b3e; }
      .whiteHead { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: white; }
      .greenHeader { fill: #2e7d32; }
      .blueHeader { fill: #1565c0; }
      .grayHeader { fill: #455a64; }
      .orangeHeader { fill: #b26a00; }
      .arrowApp { stroke: #2e7d32; stroke-width: 3; fill: none; marker-end: url(#arrowApp); }
      .arrowTool { stroke: #1565c0; stroke-width: 3; fill: none; marker-end: url(#arrowTool); }
      .arrowBuild { stroke: #455a64; stroke-width: 3; fill: none; marker-end: url(#arrowBuild); }
      .arrowFw { stroke: #b26a00; stroke-width: 3; fill: none; marker-end: url(#arrowFw); }
      .dash { stroke-dasharray: 7 6; }
    </style>
    <marker id="arrowApp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2e7d32"/></marker>
    <marker id="arrowTool" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker>
    <marker id="arrowBuild" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#455a64"/></marker>
    <marker id="arrowFw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b26a00"/></marker>
  </defs>

  <rect class="bg" width="1280" height="820"/>
  <text x="50" y="52" class="title">FRDM-MCXA153 Template: Edit Ownership and Build Flow</text>
  <text x="50" y="80" class="subtitle">The important rule: Config Tools may generate files, but CMake decides which files become firmware.</text>

  <rect x="50" y="120" width="350" height="250" rx="8" class="app"/>
  <rect x="50" y="120" width="350" height="48" rx="8" class="greenHeader"/>
  <text x="72" y="151" class="whiteHead">1A. You edit: application logic</text>
  <text x="72" y="205" class="monoBold">led_blinky.c</text>
  <text x="92" y="235" class="mono">main()</text>
  <text x="92" y="260" class="mono">SysTick_Handler()</text>
  <text x="92" y="285" class="mono">state machines / algorithms</text>
  <text x="72" y="330" class="body">Change when the behavior of the lab changes.</text>

  <rect x="50" y="405" width="350" height="230" rx="8" class="app"/>
  <rect x="50" y="405" width="350" height="48" rx="8" class="greenHeader"/>
  <text x="72" y="436" class="whiteHead">1B. You edit carefully: app glue</text>
  <text x="72" y="490" class="monoBold">frdmmcxa153/app/</text>
  <text x="92" y="520" class="mono">app.h</text>
  <text x="92" y="545" class="mono">hardware_init.c</text>
  <text x="72" y="590" class="body">Connect generated board init to the app.</text>

  <rect x="465" y="120" width="350" height="515" rx="8" class="tool"/>
  <rect x="465" y="120" width="350" height="48" rx="8" class="blueHeader"/>
  <text x="487" y="151" class="whiteHead">2. Config Tools edits: board config</text>
  <text x="487" y="205" class="monoBold">frdmmcxa153/led_blinky.mex</text>
  <text x="487" y="233" class="body">Open this in MCUXpresso Config Tools.</text>
  <path d="M640 255 L640 315" class="arrowTool"/>
  <rect x="500" y="320" width="280" height="180" rx="7" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
  <text x="522" y="350" class="monoBold">frdmmcxa153/board/</text>
  <text x="542" y="385" class="mono">pin_mux.c / .h</text>
  <text x="542" y="415" class="mono">clock_config.c / .h</text>
  <text x="542" y="445" class="mono">peripherals.c / .h</text>
  <text x="522" y="480" class="small">Generated by Update Code.</text>
  <text x="487" y="545" class="body">Do not hand-maintain generated pin, clock,</text>
  <text x="487" y="568" class="body">or peripheral setup. Change those in the tool.</text>

  <rect x="880" y="195" width="350" height="360" rx="8" class="build"/>
  <rect x="880" y="195" width="350" height="48" rx="8" class="grayHeader"/>
  <text x="902" y="226" class="whiteHead">3. CMake registers what builds</text>
  <text x="902" y="280" class="monoBold">CMakeLists.txt</text>
  <text x="922" y="310" class="body">Project target, SDK components,</text>
  <text x="922" y="333" class="body">main source, include paths.</text>
  <path d="M1055 350 L1055 395" class="arrowBuild"/>
  <text x="902" y="425" class="monoBold">frdmmcxa153/board_files.cmake</text>
  <text x="922" y="455" class="body">Lists board/generated sources and</text>
  <text x="922" y="478" class="body">handwritten app glue sources.</text>
  <text x="902" y="525" class="small">If a file is not listed here, changing it may not affect firmware.</text>

  <rect x="880" y="635" width="350" height="110" rx="8" class="fw"/>
  <rect x="880" y="635" width="350" height="44" rx="8" class="orangeHeader"/>
  <text x="902" y="663" class="whiteHead">4. Compiler output</text>
  <text x="902" y="710" class="monoBold">debug/*.elf</text>
  <text x="1010" y="710" class="monoBold">debug/*.bin</text>
  <text x="902" y="735" class="body">This is the firmware flashed to the board.</text>

  <path d="M400 245 C455 245, 810 260, 880 295" class="arrowApp"/>
  <path d="M400 520 C515 575, 780 500, 880 455" class="arrowApp"/>
  <path d="M815 410 C845 410, 855 410, 880 430" class="arrowTool"/>
  <path d="M1055 555 L1055 635" class="arrowFw"/>

  <text x="430" y="230" class="small">manual source</text>
  <text x="430" y="555" class="small">manual glue</text>
  <text x="812" y="395" class="small">generated source</text>
  <text x="1070" y="600" class="small">build</text>

  <rect x="50" y="690" width="765" height="72" rx="8" class="panel"/>
  <text x="75" y="722" class="head">Debug checklist</text>
  <text x="75" y="750" class="body">If a Config Tools change does not affect firmware, check that CMake compiles the generated file under </text>
  <text x="625" y="750" class="mono">frdmmcxa153/board/</text>
</svg>