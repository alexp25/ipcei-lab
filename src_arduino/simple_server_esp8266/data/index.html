<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP8266 Numeric Display</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #1a1f2b;
      background: #eef3f8;
    }

    main {
      width: min(92vw, 420px);
      padding: 28px;
      background: #ffffff;
      border: 1px solid #d7e0ea;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(29, 43, 68, 0.12);
    }

    h1 {
      margin: 0 0 18px;
      font-size: 22px;
      font-weight: 700;
    }

    .display {
      width: 100%;
      min-height: 132px;
      display: grid;
      place-items: center;
      border: 1px solid #b8c6d6;
      border-radius: 6px;
      background: #101820;
      color: #67f5a6;
      font-size: clamp(48px, 18vw, 84px);
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .status {
      min-height: 20px;
      margin-top: 12px;
      color: #5c6878;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>ESP8266 Numeric Display</h1>
    <div id="display" class="display">0</div>
    <div id="status" class="status"></div>
  </main>

  <script>
    const display = document.getElementById('display');
    const status = document.getElementById('status');

    async function loadValue() {
      const response = await fetch('/value');
      if (!response.ok) {
        throw new Error('Unable to read value');
      }

      const data = await response.json();
      display.textContent = Number(data.value).toFixed(2);
      status.textContent = 'Updated from UART';
    }

    loadValue().catch((error) => {
      status.textContent = error.message;
    });

    setInterval(() => {
      loadValue().catch((error) => {
        status.textContent = error.message;
      });
    }, 500);
  </script>
</body>
</html>
